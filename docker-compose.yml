# Infraestructura local de desarrollo: PostgreSQL + Redis.
# Uso: pnpm infra:up  |  pnpm infra:down  |  pnpm infra:logs
# Variables opcionales en el .env de la raíz (ver .env.example).
#
# Los puertos se publican solo en 127.0.0.1 (no accesibles desde la red local).
# Postgres usa 5433 en el host por defecto para no chocar con instalaciones nativas en 5432.

name: ai-english-immersion

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aei_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-aei_dev}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: requerido a partir de las fases con colas (BullMQ) y rate limiting distribuido.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
