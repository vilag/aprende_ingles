packages:
  - apps/*
  - packages/*

# Versiones compartidas por varios paquetes del monorepo (se referencian con "catalog:").
# La app móvil NO usa el catálogo por defecto: Expo gestiona sus versiones con `expo install`.
catalog:
  '@types/node': ^22.19.0
  # ESLint 10 para API y paquetes. Web y móvil usan "catalog:eslint9" porque los plugins
  # de eslint-config-next / eslint-config-expo aún no soportan la v10.
  # Ver docs/architecture/decisions/0002-versiones-y-herramientas.md
  eslint: ^10.0.0
  typescript: ~6.0.3
  typescript-eslint: ^8.74.0
  vitest: ^5.1.0
  zod: ^4.6.0

catalogs:
  eslint9:
    eslint: ^9.39.5

# Seguridad de la cadena de suministro: solo estos paquetes pueden ejecutar
# scripts de instalación. Cualquier paquete nuevo con scripts falla la instalación
# hasta que se revise y se agregue aquí de forma explícita.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Telemetría de terceros: no se necesita.
  '@scarf/scarf': false
  # Next.js funciona sin estos binarios opcionales en desarrollo.
  sharp: false
  unrs-resolver: false
